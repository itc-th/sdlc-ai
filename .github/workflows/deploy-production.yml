name: Deploy Production

on:
  push:
    tags:
      - 'v*'

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  deploy:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Deploy to Production
        run: |
          npm i -g vercel
          pnpm install --frozen-lockfile
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          # Copy env vars so Next.js can read them during build
          cp .vercel/.env.production.local apps/web/.env.local
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} --generate-notes

      - name: Summary
        run: |
          echo "## 🚀 Production Deployed" >> $GITHUB_STEP_SUMMARY
          echo "Version: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "URL: https://sdlc-ai-omega.vercel.app" >> $GITHUB_STEP_SUMMARY

      - name: Notify Slack
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            EMOJI="🚀"
            STATUS="สำเร็จ"
          else
            EMOJI="❌"
            STATUS="ล้มเหลว"
          fi
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d "{
              \"blocks\": [
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"${EMOJI} *Deploy Production ${STATUS}*\n• Version: \`${{ github.ref_name }}\`\n• By: ${{ github.actor }}\n• <https://sdlc-ai-omega.vercel.app|เปิด Production> · <https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}|Release Notes>\"
                  }
                }
              ]
            }"
